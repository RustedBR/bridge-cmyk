name: build-windows

# Gera BridgeCMYK.exe automaticamente e publica como Release no GitHub.
# - A cada push na branch master
# - Também pode rodar manualmente: Actions > build-windows > Run workflow

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # necessário para criar/atualizar a Release

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build BridgeCMYK.exe (onefile)
        run: |
          pyinstaller --noconfirm --onefile --windowed --name BridgeCMYK --add-data "src;src" src\main.py

      - name: Empacotar com config.example + LEIA-ME
        shell: pwsh
        run: |
          Copy-Item config.example.json dist\config.json
          Copy-Item LEIA-ME.txt dist\LEIA-ME.txt
          Compress-Archive -Path dist\* -DestinationPath BridgeCMYK-win64.zip -Force

      - name: Instalar Inno Setup (compilador do instalador assistente)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe nao encontrado" }
          Write-Host "Inno Setup OK: $iscc"

      - name: Compilar instalador assistente (BridgeCMYKSetup.exe)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts\bridgecmyk_setup.iss | Out-Host
          if (-not (Test-Path dist\BridgeCMYKSetup-0.1.0.exe)) { throw "Instalador nao gerado" }
          Get-Item dist\BridgeCMYKSetup-0.1.0.exe | Select-Object Name, Length

      - name: Upload artefato (download direto na aba Actions)
        uses: actions/upload-artifact@v4
        with:
          name: BridgeCMYK-win64
          path: |
            BridgeCMYK-win64.zip
            dist/BridgeCMYK.exe
            dist/BridgeCMYKSetup-0.1.0.exe

      - name: Criar/atualizar Release com .exe + instalador
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-latest
          name: Bridge CMYK — build mais recente
          body: |
            Última versão compilada automaticamente.

            **Para usuário comum (instalador assistente):**
            - **BridgeCMYKSetup-0.1.0.exe** — instalador com assistente
              (próximo → próximo → instalar, atalho no menu Iniciar)

            **Para uso portátil:**
            - **BridgeCMYK.exe** — programa completo (basta executar)
            - **BridgeCMYK-win64.zip** — .exe + config.json + LEIA-ME.txt

            Após instalar, abra o Bridge CMYK, preencha a aba Configuração
            (credenciais do financeiro) e clique em Sincronizar.
          files: |
            dist/BridgeCMYK.exe
            BridgeCMYK-win64.zip
            dist/BridgeCMYKSetup-0.1.0.exe
          generate_release_notes: false
